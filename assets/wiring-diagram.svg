<text x="20" y="630" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52525b" text-anchor="start">All analog inputs are on ADC1 because ADC2 is unavailable while Wi-Fi is active. Common ground for all modules.</text>
<text x="20" y="668" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#71717a" font-style="italic">Reference wiring for the firmware in this repository - NOT the original prototype schematic. Verify against your own modules.</text>
