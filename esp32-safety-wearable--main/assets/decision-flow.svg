<svg xmlns="http://www.w3.org/2000/svg" width="940" height="980" viewBox="0 0 940 980" role="img" aria-label="Decision Logic (include/decision.h)">
<title>Decision Logic (include/decision.h)</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f3f46"/></marker></defs>
<rect width="940" height="980" fill="#ffffff"/>
<text x="20" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b">Decision Logic (include/decision.h)</text>
<rect x="180" y="55" width="240" height="44" rx="8" fill="#f4f4f5" stroke="#3f3f46" stroke-width="1.6"/>
<text x="300.0" y="82.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">Every loop iteration</text>
<polygon points="300,120.0 420.0,160 300,200.0 180.0,160" fill="#fff7e6" stroke="#b7791f" stroke-width="1.6"/>
<text x="300" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#18181b" text-anchor="middle">Panic event?</text>
<text x="300" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#18181b" text-anchor="middle">(held &gt;= 1.5 s)</text>
<polygon points="300,235.0 420.0,275 300,315.0 180.0,275" fill="#fff7e6" stroke="#b7791f" stroke-width="1.6"/>
<text x="300" y="279" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#18181b" text-anchor="middle">In EMERGENCY?</text>
<polygon points="300,350.0 420.0,390 300,430.0 180.0,390" fill="#fff7e6" stroke="#b7791f" stroke-width="1.6"/>
<text x="300" y="386" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#18181b" text-anchor="middle">Calibrated?</text>
<text x="300" y="402" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#18181b" text-anchor="middle">(15 s elapsed)</text>
<rect x="130" y="455" width="340" height="100" rx="8" fill="#fff7e6" stroke="#b7791f" stroke-width="1.6"/>
<text x="300.0" y="486.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">Evaluate sensor conditions</text>
<text x="300.0" y="502.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3f3f46" text-anchor="middle">ECG: rate &gt;= 1.25 x resting baseline</text>
<text x="300.0" y="518.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3f3f46" text-anchor="middle">GSR: |filtered - baseline| / baseline &gt;= 0.15</text>
<text x="300.0" y="534.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3f3f46" text-anchor="middle">PIR: HIGH seen within last 5 s</text>
<polygon points="300,580.0 440.0,625 300,670.0 160.0,625" fill="#fff7e6" stroke="#b7791f" stroke-width="1.6"/>
<text x="300" y="621" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#18181b" text-anchor="middle">All 3 true continuously</text>
<text x="300" y="637" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#18181b" text-anchor="middle">for &gt;= 10 s?</text>
<polygon points="300,720.0 420.0,760 300,800.0 180.0,760" fill="#fff7e6" stroke="#b7791f" stroke-width="1.6"/>
<text x="300" y="764" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#18181b" text-anchor="middle">At least 2 true?</text>
<rect x="210" y="840" width="180" height="50" rx="8" fill="#eafaf0" stroke="#2f855a" stroke-width="1.6"/>
<text x="300.0" y="862.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">NORMAL</text>
<text x="300.0" y="878.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3f3f46" text-anchor="middle">green LED</text>
<path d="M 300,99 L 300,120" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 300,200 L 300,235" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="318" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52525b" text-anchor="middle">no</text>
<path d="M 300,315 L 300,350" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="318" y="337" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52525b" text-anchor="middle">no</text>
<path d="M 300,430 L 300,455" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="322" y="447" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52525b" text-anchor="middle">yes</text>
<path d="M 300,555 L 300,580" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 300,670 L 300,720" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="360" y="700" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52525b" text-anchor="middle">no / interrupted</text>
<path d="M 300,800 L 300,840" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="318" y="825" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52525b" text-anchor="middle">no</text>
<rect x="620" y="135" width="240" height="50" rx="8" fill="#fdecec" stroke="#c53030" stroke-width="1.6"/>
<text x="740.0" y="157.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">EMERGENCY (manual)</text>
<text x="740.0" y="173.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3f3f46" text-anchor="middle">red LED, send alert</text>
<path d="M 420,160 L 620,160" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="520.0" y="154.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52525b" text-anchor="middle">yes</text>
<polygon points="740,240.0 840.0,275 740,310.0 640.0,275" fill="#fff7e6" stroke="#b7791f" stroke-width="1.6"/>
<text x="740" y="271" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#18181b" text-anchor="middle">Cancel event?</text>
<text x="740" y="287" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#18181b" text-anchor="middle">(held &gt;= 5 s)</text>
<path d="M 420,275 L 640,275" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="530.0" y="269.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52525b" text-anchor="middle">yes</text>
<rect x="620" y="345" width="240" height="44" rx="8" fill="#fdecec" stroke="#c53030" stroke-width="1.6"/>
<text x="740.0" y="372.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">stay EMERGENCY (latched)</text>
<path d="M 740,310 L 740,345" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="758" y="332" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52525b" text-anchor="middle">no</text>
<rect x="620" y="205" width="240" height="34" rx="8" fill="#eafaf0" stroke="#2f855a" stroke-width="1.6"/>
<text x="740.0" y="227.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">-&gt; NORMAL</text>
<path d="M 840,275 L 885,275 L 885,222 L 860,222" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="892" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52525b" text-anchor="start">yes</text>
<rect x="620" y="410" width="240" height="44" rx="8" fill="#fff7e6" stroke="#b7791f" stroke-width="1.6"/>
<text x="740.0" y="429.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">CALIBRATING</text>
<text x="740.0" y="445.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3f3f46" text-anchor="middle">yellow LED blinking</text>
<path d="M 420,390 L 560,390 L 560,432 L 620,432" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="520" y="382" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52525b" text-anchor="middle">no</text>
<rect x="620" y="600" width="240" height="50" rx="8" fill="#fdecec" stroke="#c53030" stroke-width="1.6"/>
<text x="740.0" y="622.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">EMERGENCY (automatic)</text>
<text x="740.0" y="638.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3f3f46" text-anchor="middle">red LED, send alert</text>
<path d="M 440,625 L 620,625" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="530.0" y="619.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52525b" text-anchor="middle">yes</text>
<rect x="620" y="735" width="240" height="50" rx="8" fill="#fff7e6" stroke="#b7791f" stroke-width="1.6"/>
<text x="740.0" y="757.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">WARNING</text>
<text x="740.0" y="773.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3f3f46" text-anchor="middle">yellow LED, no alert</text>
<path d="M 420,760 L 620,760" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="520.0" y="754.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52525b" text-anchor="middle">yes</text>
<text x="20" y="930" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52525b" text-anchor="start">Thresholds are reference values from include/config.h; they have not been calibrated against measured data.</text>
<text x="20" y="968" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#71717a" font-style="italic">Conceptual diagram of the reference firmware in this repository - not captured data or a photo of the original prototype.</text>
</svg>
