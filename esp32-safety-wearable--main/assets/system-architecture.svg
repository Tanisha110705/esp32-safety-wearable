<path d="M 240,192 L 310,192" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 240,282 L 310,282" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 240,422 L 310,422" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 460,145 L 490,145" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 565,195 L 565,225" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 460,422 L 565,422 L 565,355" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="512" y="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52525b" text-anchor="middle">panic / cancel</text>
<rect x="720" y="90" width="190" height="80" rx="8" fill="#eafaf0" stroke="#2f855a" stroke-width="1.6"/>
