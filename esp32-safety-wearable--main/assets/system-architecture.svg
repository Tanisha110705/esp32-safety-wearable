<text x="815.0" y="143.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3f3f46" text-anchor="middle">green / yellow / red</text>
<rect x="720" y="230" width="190" height="64" rx="8" fill="#eafaf0" stroke="#2f855a" stroke-width="1.6"/>
<text x="815.0" y="259.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">Wi-Fi (STA)</text>
<text x="815.0" y="275.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3f3f46" text-anchor="middle">HTTP(S) POST, JSON</text>
<rect x="720" y="340" width="190" height="64" rx="8" fill="#ffffff" stroke="#71717a" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="815.0" y="369.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">Notification endpoint</text>
<text x="815.0" y="385.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3f3f46" text-anchor="middle">user-provided service</text>
<rect x="720" y="440" width="190" height="64" rx="8" fill="#ffffff" stroke="#71717a" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="815.0" y="469.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">Emergency contact</text>
<text x="815.0" y="485.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3f3f46" text-anchor="middle">SMS / chat / call</text>
<path d="M 640,250 L 675,250 L 675,130 L 720,130" fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arrow)"/>
